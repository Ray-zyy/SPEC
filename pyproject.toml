[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-streamflow"
version = "0.1.0"
description = "Symmetric Percentile Evaluation Curves for flow-resolved streamflow model evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "tqdm",
  "tabulate",
  "shap",
]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["spec*"]
